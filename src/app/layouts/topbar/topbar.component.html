<header
	class="border-b border-[var(--c-border)] bg-[var(--c-bg-secondary)]/95 backdrop-blur supports-[backdrop-filter]:bg-[var(--c-bg-secondary)]/80"
>
	<div
		class="mx-auto flex min-h-16 w-full max-w-[var(--container)] items-center justify-between overflow-visible px-4 py-3 sm:px-6"
	>
		<a
			[translate]="{ ariaLabel: 'На головну' }"
			class="inline-flex items-center gap-3"
			routerLink="/"
		>
			@if (company().name) {
				<span class="text-sm font-semibold tracking-[0.16em] text-[var(--c-text-strong)]">
					{{ company().name }}
				</span>
			}
		</a>

		<div class="flex items-center gap-2">
			<nav class="hidden items-center gap-1 md:flex" aria-label="Основна навігація">
				<a pButton routerLink="/map" text rounded severity="secondary">Карта</a>
				<a pButton routerLink="/book" text rounded severity="secondary">Бронювання</a>
				<a pButton routerLink="/rules" text rounded severity="secondary">Правила</a>
				<a pButton routerLink="/ranking" text rounded severity="secondary">Рейтинг</a>
			</nav>

			<button
				pButton
				type="button"
				rounded
				text
				severity="secondary"
				class="!h-9 !gap-2"
				[attr.aria-label]="languageCycleLabel()"
				(click)="nextLanguage()"
			>
				<img
					class="h-5 w-7 rounded-[4px] border border-black/10 object-cover"
					[alt]="currentLanguage().nativeName"
					[ngSrc]="currentLanguage().flagSrc"
					width="28"
					height="20"
				/>
			</button>

			<button
				pButton
				type="button"
				rounded
				text
				severity="secondary"
				icon="pi pi-angle-down"
				[attr.aria-label]="languageMenuLabel()"
				(click)="languagePopover.toggle($event)"
			></button>

			<p-popover #languagePopover>
				<div class="flex min-w-48 flex-col gap-1">
					@for (language of languages(); track language.code) {
						<button
							pButton
							type="button"
							text
							class="!justify-start !gap-3"
							(click)="setLanguage(language); languagePopover.hide()"
						>
							<img
								class="h-5 w-7 rounded-[4px] border border-black/10 object-cover"
								[alt]="language.nativeName"
								[ngSrc]="language.flagSrc"
								width="28"
								height="20"
							/>
							<span>{{ language.nativeName }}</span>
						</button>
					}
				</div>
			</p-popover>

			<button
				pButton
				type="button"
				rounded
				text
				severity="secondary"
				class="!h-11 !w-11"
				[icon]="mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
				[attr.aria-label]="toggleLabel()"
				(click)="toggleMode()"
			></button>

			<a
				pButton
				routerLink="/challenges"
				rounded
				text
				severity="secondary"
				class="!h-11 !w-11"
				icon="pi pi-bolt"
				aria-label="Випадковий SUP-челендж"
			></a>
		</div>
	</div>
</header>
