<section class="ranking-page">
	<div class="ranking-panel">
		<h1 translate="Рейтинг">Рейтинг</h1>
		<p
			class="ranking-description"
			translate="Перегляньте, хто набрав найбільше балів на річці."
		>
			Перегляньте, хто набрав найбільше балів на річці.
		</p>

		<p-selectbutton
			class="periods"
			[options]="periods"
			optionLabel="label"
			optionValue="value"
			[ngModel]="period()"
			(ngModelChange)="period.set($event)"
			aria-label="Період рейтингу"
		/>

		<ol class="leaderboard">
			@for (entry of entries(); track entry.username; let position = $index) {
				<li>
					<app-participator-short [entity]="entry" [position]="position + 1" />
				</li>
			}
		</ol>

		<section class="ranking-points">
			<h2>Як заробити більше балів?</h2>
			<p>Виконуй SUP-челенджі, знімай їх у Story та піднімайся у рейтингу KP - SUP - KP.</p>
			<a pButton routerLink="/points">Переглянути челенджі</a>
		</section>
	</div>
</section>
