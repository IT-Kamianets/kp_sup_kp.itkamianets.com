<section
	class="challenge-player"
	(pointerdown)="onPointerStart($event)"
	(pointerup)="onPointerEnd($event)"
	(wheel)="onWheel($event)"
	(keydown.arrowup)="advanceChallenge()"
	(keydown.arrowdown)="advanceChallenge()"
	tabindex="0"
>
	<div
		class="challenge-stack"
		[class.challenge-stack--advancing]="isAdvancing()"
		[class.challenge-stack--resetting]="isResetting()"
	>
		<article class="challenge-card challenge-card--active" aria-live="polite">
			<p>{{ translate('Випадковий SUP-челендж') }}</p>
			<app-challenge-short [entity]="activeChallengeView()" variant="card" />
		</article>
		<article class="challenge-card challenge-card--next" aria-hidden="true">
			<p>{{ translate('Випадковий SUP-челендж') }}</p>
			<app-challenge-short [entity]="nextChallengeView()" variant="card" />
		</article>
	</div>
	<div class="swipe-hint">
		<span class="material-symbols-outlined">keyboard_arrow_up</span>
		<span>{{ translate('Проведи вгору для наступного челенджу') }}</span>
		<button pButton (click)="advanceChallenge()" type="button">
			<span class="material-symbols-outlined" aria-hidden="true">shuffle</span>
			Наступний челендж
		</button>
	</div>
</section>
